# The spaces-alpha snapshots reference @atproto/lex* packages whose stable
# publishes carry unrewritten workspace:* deps, so the whole family is pinned
# here (the official bulletin sample uses the `alpha` dist-tag for this).
#
# **Pinned to the exact snapshot, not to `alpha`.** A floating tag re-resolves
# only for packages pnpm has no lock entry for: bumping the pilot to the
# 2026-09-10 snapshot left every already-locked `alpha` override on the
# 2026-08-18 one and pulled the new ones forward, so `@atproto/pds` imported a
# `@atproto/lex` that no longer had what it asked for and the pilot died at
# startup on `does not provide an export named 'walk'`. One version string for
# the family and for pilot/package.json keeps the tree coherent.
#
# The family also grows with the alpha: the 2026-09-10 snapshot added lex-cbor,
# lex-data and lex-json, and install fails on the first one left out
# ("@atproto/lex-data@workspace:*" is in the dependencies but no package named
# … is present in the workspace). When a bump fails that way, the missing name
# is in the error — add it here.
overrides:
  "@atproto/lex": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-builder": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-cbor": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-cli": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-client": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-data": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-document": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-installer": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-json": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-resolver": 0.0.0-spaces-alpha-20261029171913
  "@atproto/lex-schema": 0.0.0-spaces-alpha-20261029171913
